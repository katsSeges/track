name: Release

# Push a tag like v1.0.0 (it must match <Version> in src/Track.App/Track.App.csproj) to build, test, package
# and publish a GitHub release with Track-<version>-win-x64.zip and its .sha256.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Track.slnx -c Release --nologo

      - name: Test (100 % coverage gate)
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $notes = "docs/release-notes/v$version.md"
          $assets = "artifacts/Track-$version-win-x64.zip", "artifacts/Track-$version-win-x64.zip.sha256"
          if (Test-Path $notes) {
            gh release create '${{ github.ref_name }}' @assets --title "Track $version" --notes-file $notes
          } else {
            gh release create '${{ github.ref_name }}' @assets --title "Track $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
