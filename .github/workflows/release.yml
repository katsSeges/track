name: Release

# Push a tag like v1.0.0 (it must match <Version> in src/Track.App/Track.App.csproj) to build, test, package
# and publish a GitHub release with the ZIP, Setup EXE and their SHA-256 checksums.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Track.slnx -c Release --nologo

      - name: Test (100 % coverage gate)
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Invalid Inno Setup signature' }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed ($($process.ExitCode))" }

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - name: Verify installer lifecycle (isolated per-user install)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -IsccPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $notes = "docs/release-notes/v$version.md"
          $assets = "artifacts/Track-$version-win-x64.zip", "artifacts/Track-$version-win-x64.zip.sha256",
                    "artifacts/Track-$version-win-x64-setup.exe", "artifacts/Track-$version-win-x64-setup.exe.sha256"
          if (Test-Path $notes) {
            gh release create '${{ github.ref_name }}' @assets --title "Track $version" --notes-file $notes
          } else {
            gh release create '${{ github.ref_name }}' @assets --title "Track $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
