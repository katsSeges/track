name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Track.slnx -c Release --nologo

      # Fails unless all tests pass and Track.Core has 100 % line, branch and method coverage.
      - name: Test (100 % coverage gate)
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage.cobertura.xml
          if-no-files-found: ignore
